<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DroidGuard AI | SOC Dashboard{% endblock %}</title>

    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>

<div class="cyber-bg"></div>

<nav class="navbar navbar-expand-lg fixed-top navbar-dark cyber-navbar">
    <div class="container">
        <a class="navbar-brand fs-4 fw-bold d-flex align-items-center" href="/">
            <div class="spinner-grow spinner-grow-sm text-info me-2" role="status" style="width: 1rem; height: 1rem;"></div>
            <span style="letter-spacing: 1px;">DROID<span style="color: var(--neon-cyan);">GUARD</span></span>
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <i class="fas fa-bars text-info"></i>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav ms-auto gap-2 align-items-center">
                <li class="nav-item"><a class="nav-link px-3 text-white" href="/"><i class="fas fa-home me-1 text-info"></i> Trang chủ</a></li>
                <li class="nav-item"><a class="nav-link px-3 text-white" href="/scan"><i class="fas fa-radar me-1 text-info"></i> Quét file</a></li>
                <li class="nav-item"><a class="nav-link px-3 text-white" href="/dashboard"><i class="fas fa-chart-line me-1 text-info"></i> Dashboard</a></li>
                <li class="nav-item"><a class="nav-link px-3 text-white" href="/history"><i class="fas fa-history me-1 text-info"></i> Lịch sử</a></li>
                <li class="nav-item"><a class="nav-link px-3 text-white" href="/file-manager"><i class="fas fa-folder-open me-1 text-info"></i> Quản lý</a></li>
                <li class="nav-item ms-lg-3 d-none d-lg-block">
                    <span class="badge rounded-pill bg-dark border border-info text-info py-2 px-3 shadow-sm">
                        <i class="fas fa-circle text-success me-1" style="font-size: 0.6rem;"></i> SYSTEM ONLINE
                    </span>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container main-content fade-in">
    {% block content %}{% endblock %}
</div>

<footer class="text-center py-4 mt-5" style="border-top: 1px solid rgba(255,255,255,0.05); background: rgba(0,0,0,0.4);">
    <small class="text-light" style="letter-spacing: 1px; opacity: 0.6;">
        <i class="fas fa-shield-alt me-1 text-info"></i> DroidGuard AI Core System • Đồ án Cơ sở An toàn Thông tin
    </small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
{% block extra_js %}{% endblock %}

</body>
</html>
